<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project</title>
     <link rel="stylesheet" href="05_style.css">
    <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" 
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body class="body">

    <br>

    <!--Navigation header-->
    <header class="header">
        <h4>Entrep Fair</h4>

        <!--Link to the Cafe Menu page-->
        <nav>
            <a href="01_index.html">Cafe Menu</a>
        </nav>
    </header>

    <!--SKU Generator title-->
    <h1 class="h1">SKU Generator</h1>

    <!--SKU Generator form-->
    <div class="receipt">

        <h2>Generate Product SKU</h2>

        <br>

        <!--Product category selection-->
        <label for="category">Select Category:</label>

        <br><br>

        <select id="category" class="soft_drink">

            <option value="">Select Category</option>
 
            <option value="FOO">Food</option>

            <option value="SNK">Snacks</option>

            <option value="DES">Desserts</option>

            <option value="DRK">Drinks</option>

        </select>

        <br><br><br>

        <!--Product name input-->
        <label for="product">Enter Product Name:</label>

        <br><br>

        <input type="text" id="product" placeholder="Ex: Fried Chicken">

        <br><br>

        <!--Stock quantity input-->
        <label for="stock">Enter Stock Quantity</label>

        <br><br>

        <input type="number" id="stock" placeholder="Enter Number" min="0">

        <br><br><br>

        <!--Button that runs the Python SKU gnerator-->
        <button class="button" type="button" py-click="generate_sku">Generate SKU</button>

        <br>

        <!--Gnerated SKU display area-->
        <div id="sku_result">
            <h2>SKU will appear here</h2>
        </div>
    </div>

    <script type="py" src="04_sku.py"></script>
    
</body>
</html>
